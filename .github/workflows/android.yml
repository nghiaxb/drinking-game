name: Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Ubuntu is enough for Android and costs 1x minutes, unlike the macOS runner iOS needs.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          # AGP 8.13 needs JDK 17+; 21 is what the Android Gradle plugin targets.
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - run: npm ci

      # prebuild generates the artwork, sounds and SEO files that vite-ssg then bundles.
      - name: Build web bundle
        run: npm run build

      - name: Copy the bundle into the native project
        run: npx cap sync android

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    # Only runs once the three signing secrets exist; without them a release build cannot be signed.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - uses: android-actions/setup-android@v4

      - name: Check for signing secrets
        id: secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANDROID_KEYSTORE_BASE64 not set — skipping the signed release build."
          fi

      - if: steps.secrets.outputs.present == 'true'
        run: npm ci

      - if: steps.secrets.outputs.present == 'true'
        run: npm run build

      - if: steps.secrets.outputs.present == 'true'
        run: npx cap sync android

      - name: Restore keystore
        if: steps.secrets.outputs.present == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.jks

      - name: Bundle signed AAB
        if: steps.secrets.outputs.present == 'true'
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_RELEASE_STORE_FILE: release.jks
          ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v7
        if: steps.secrets.outputs.present == 'true'
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
